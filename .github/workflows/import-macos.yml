name: Import verified macOS release
on:
  workflow_dispatch:
    inputs:
      artifactUrl:
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/import-macos-artifact.py
